<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../../CSS/cadastro.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class = "cadastro-container">
    <div class="logo-container">
      <img src="../../Assets/logo_temp.png" alt="Logo GymLeague" class="logo-image">
      <h2 class ="form-title">Cadastro de Usuário</h2>
    </div>
    <form>
      <div class="mb-3">
        <label for="nome" class="form-label">Nome de usuário</label>
        <input type="text" class="form-control" id="nome" placeholder="Digite seu nome de usuário">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email do usuário</label>
        <input type="email" class="form-control" id="email" placeholder="Digite seu email">
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
      </div>
      <div class="mb-3">
        <label for="confirmar-senha" class="form-label">Confirmar Senha</label>
        <input type="password" class="form-control" id="confirmar-senha" placeholder="Confirme sua senha">
      </div>
      <button type="submit" class="btn btn-success btn-cadastro position-relative">
                <span class="cadastro-text">Cadastrar-se</span>
                <i class="bi bi-box-arrow-in-right ms-2 cadastro-icon"></i>
      </button>
    </form>
  </div>
</body>
</html>
